<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FABIAN FLIX | Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
main{max-width:700px;margin:30px auto}
section{background:#151d30;border:1px solid #29364f;border-radius:14px;padding:22px;margin-bottom:18px}
h1{color:#60a5fa}
label{display:block;margin:14px 0 7px}
input,textarea,button{width:100%;padding:12px;border-radius:8px;border:1px solid #394761;background:#0b1020;color:white;font:inherit}
button{background:#2563eb;border:0;margin-top:16px;cursor:pointer}
.note{color:#b7c4d8;line-height:1.8}
#panel{display:none}
</style>
</head>
<body>
<main>
<section>
<h1>FABIAN FLIX</h1>
<h3>Movie Administration Panel</h3>
<p class="note">Sign in to manage your movies.</p>
</section>

<section id="login">
<h2>Admin Login</h2>
<label for="email">Email Address</label>
<input id="email" type="email" autocomplete="username" placeholder="Enter your email">
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Enter your password">
<button id="loginBtn">Sign In</button>
<p id="loginMsg" class="note"></p>
</section>

<section id="panel">
<h2>Add a Movie</h2>
<form id="movieForm">
<label for="title">Movie Title</label>
<input id="title" required placeholder="Enter movie title">
<label for="genre">Genre</label>
<input id="genre" placeholder="e.g. Action, Drama">
<label for="year">Release Year</label>
<input id="year" type="number" min="1900" max="2100">
<label for="description">Description</label>
<textarea id="description" rows="3" placeholder="Enter movie description"></textarea>
<label for="poster">Movie Poster</label>
<input id="poster" type="file" accept="image/*">
<label for="video">Video File</label>
<input id="video" type="file" accept="video/*">
<button type="submit">Upload and Save Movie</button>
</form>
<p id="movieMsg" class="note"></p>
<button id="logoutBtn">Sign Out</button>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://brtridmeoikagagnyzim.supabase.co";
const SUPABASE_KEY = "sb_publishable_Md_71o-NUxgvQlp4OJVRWQ_7e-4CGho";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

function showMessage(id, text) {
  $(id).textContent = text;
}

async function refreshSession() {
  const { data } = await client.auth.getSession();
  const loggedIn = !!data.session;
  $("login").style.display = loggedIn ? "none" : "block";
  $("panel").style.display = loggedIn ? "block" : "none";
}

$("loginBtn").addEventListener("click", async () => {
  showMessage("loginMsg", "Signing in...");
  const { error } = await client.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value
  });

  if (error) {
    showMessage("loginMsg", "Sign-in failed. Check your email and password.");
    return;
  }

  showMessage("loginMsg", "");
  await refreshSession();
});

$("logoutBtn").addEventListener("click", async () => {
  await client.auth.signOut();
  await refreshSession();
});

$("movieForm").addEventListener("submit", async event => {
  event.preventDefault();

  const { data: sessionData } = await client.auth.getSession();
  if (!sessionData.session) {
    showMessage("movieMsg", "Please sign in first.");
    return;
  }

  const title = $("title").value.trim();
  const genre = $("genre").value.trim();
  const year = $("year").value ? Number($("year").value) : null;
  const description = $("description").value.trim();
  const posterFile = $("poster").files[0];
  const videoFile = $("video").files[0];

  if (!posterFile || !videoFile) {
    showMessage("movieMsg", "Please select both a poster and a video file.");
    return;
  }

  showMessage("movieMsg", "Uploading files...");

  try {
    const posterPath = crypto.randomUUID() + "-" + posterFile.name;
    const videoPath = crypto.randomUUID() + "-" + videoFile.name;

    const posterResult = await client.storage.from("movies")
      .upload(posterPath, posterFile);
    if (posterResult.error) throw posterResult.error;

    const videoResult = await client.storage.from("movies")
      .upload(videoPath, videoFile);
    if (videoResult.error) throw videoResult.error;

    const { error } = await client.from("movies").insert({
      title,
      genre,
      release_year: year,
      description,
      poster_path: posterPath,
      video_path: videoPath,
      published: false
    });

    if (error) throw error;

    showMessage("movieMsg", "Movie saved successfully as a draft.");
    $("movieForm").reset();
  } catch (error) {
    showMessage("movieMsg", "Upload failed. Please check your database and storage permissions.");
  }
});

refreshSession();
</script>
</body>
</html>
