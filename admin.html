<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پنل مدیریت | FABIAN FLIX</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #0b1020;
      color: #fff;
      padding: 24px;
    }
    .container {
      max-width: 700px;
      margin: 30px auto;
    }
    .card {
      background: #151d30;
      border: 1px solid #29364f;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }
    h1 { color: #60a5fa; }
    h2 { font-size: 20px; }
    label {
      display: block;
      margin: 16px 0 8px;
    }
    input, textarea, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #394761;
      background: #0b1020;
      color: white;
      font: inherit;
    }
    button {
      background: #2563eb;
      border: 0;
      margin-top: 18px;
      cursor: pointer;
    }
    .note {
      color: #b7c4d8;
      line-height: 1.9;
      font-size: 14px;
    }
    #panel { display: none; }
    #message { line-height: 1.8; }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>FABIAN FLIX</h1>
      <p>پنل مدیریت فیلم‌ها</p>
      <p class="note">
        این نسخه فقط ظاهر پنل را آماده می‌کند و هنوز به پایگاه داده متصل نیست.
      </p>
    </section>

    <section class="card" id="login">
      <h2>ورود مدیر</h2>
      <p class="note">
        ورود واقعی پس از اتصال امن به Supabase فعال می‌شود.
      </p>
      <label for="email">ایمیل مدیر</label>
      <input id="email" type="email" placeholder="ایمیل مدیر">
      <label for="password">رمز عبور</label>
      <input id="password" type="password" placeholder="رمز عبور">
      <button type="button" onclick="showNotice()">
        ورود
      </button>
      <p id="message"></p>
    </section>

    <section class="card" id="panel">
      <h2>افزودن فیلم</h2>
      <form id="movieForm">
        <label for="title">نام فیلم</label>
        <input id="title" required placeholder="نام فیلم">

        <label for="genre">ژانر</label>
        <input id="genre" placeholder="مثلاً اکشن">

        <label for="year">سال انتشار</label>
        <input id="year" type="number" min="1900" max="2100">

        <label for="description">توضیحات</label>
        <textarea id="description" rows="4"></textarea>

        <label for="poster">تصویر پوستر</label>
        <input id="poster" type="file" accept="image/*">

        <label for="video">فایل ویدیو</label>
        <input id="video" type="file" accept="video/*">

        <button type="submit">ثبت فیلم</button>
      </form>
      <p id="movieMessage" class="note"></p>
    </section>
  </main>

  <script>
    function showNotice() {
      document.getElementById("message").textContent =
        "ورود هنوز فعال نیست؛ ابتدا باید اتصال امن Supabase تنظیم شود.";
    }

    document.getElementById("movieForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("movieMessage").textContent =
        "فیلم هنوز ذخیره نشده است. برای ذخیره واقعی باید Supabase را متصل کنیم.";
    });
  </script>
</body>
</html>
